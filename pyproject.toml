[project]
name = "uniwatch"
version = "0.1.0"
description = "Multi-site log, alert and report server for UniFi networks, built for MSPs"
license = "AGPL-3.0-only"
authors = [{ name = "ARE19" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

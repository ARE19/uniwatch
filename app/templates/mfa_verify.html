{% extends "base.html" %}
{% block title %}Two-factor · {{ app_name() }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Enter your code</h1>
  <p>Open your authenticator app and enter the 6-digit code for {{ user.username }}.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/mfa" hx-boost="false">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>6-digit code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required autofocus></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}

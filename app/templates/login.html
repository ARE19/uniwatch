{% extends "base.html" %}
{% block title %}Sign in · {{ app_name() }}{% endblock %}
{% block content %}
<section class="card narrow">
  <div class="login-brand"><img src="/static/uniwatch-logo.png" alt="" width="88" height="88"><div class="login-name">{{ app_name() }}</div></div>
  <h1>Sign in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" hx-boost="false">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
